<script>

// ===== CONFIG =====
const URL="https://ubfytoriwbhglblxdzto.supabase.co"
const KEY="sb_publishable_vd185mW1MiBYYxKZg1HwRg_pOuAWq72"

let myName, myId, currentUser = null

// ===== DOUBLE RATCHET STATE =====
// Сессии хранятся по chatId (хеш от имён)
let drSessions = {}  // { chatId: { rootKey, sendChainKey, recvChainKey, sendCounter, recvCounter, prevCounter, remotePublicKey, localPublicKey, identityKey, remoteIdentityKey } }

// Глобальные ключи пользователя
let myIdentityKeyPair = null      // CryptoKeyPair (ECDH P-256)
let mySignedPrekeyPair = null     // для простоты используем тот же identity как signed prekey

// Вспомогательные функции WebCrypto
async function generateECDHKeyPair() {
  return await crypto.subtle.generateKey(
    { name: "ECDH", namedCurve: "P-256" },
    true,
    ["deriveKey", "deriveBits"]
  );
}

// DH: общий секрет между приватным и публичным ключами
async function dh(privateKey, publicKey) {
  return await crypto.subtle.deriveBits(
    { name: "ECDH", public: publicKey },
    privateKey,
    256 // длина в битах
  );
}

// HKDF (используем HMAC-SHA256)
async function hkdf(salt, ikm, info, length) {
  const prk = await crypto.subtle.importKey(
    "raw",
    ikm,
    { name: "HMAC", hash: "SHA-256" },
    false,
    ["sign"]
  );
  const saltKey = await crypto.subtle.importKey(
    "raw",
    salt,
    { name: "HMAC", hash: "SHA-256" },
    false,
    ["sign"]
  );
  const prkFromSalt = await crypto.subtle.sign("HMAC", saltKey, new Uint8Array(ikm));
  // теперь используем prkFromSalt как PRK
  const prkKey = await crypto.subtle.importKey(
    "raw",
    prkFromSalt,
    { name: "HMAC", hash: "SHA-256" },
    false,
    ["sign"]
  );
  let t = new Uint8Array(0);
  let okm = new Uint8Array(0);
  const infoBytes = new TextEncoder().encode(info);
  for (let i = 1; i <= Math.ceil(length / 32); i++) {
    const data = new Uint8Array([...t, ...infoBytes, i]);
    const step = await crypto.subtle.sign("HMAC", prkKey, data);
    t = new Uint8Array(step);
    okm = new Uint8Array([...okm, ...t]);
  }
  return okm.slice(0, length);
}

// KDF для корневого ключа: (rootKey, dhOut) -> (newRootKey, chainKey)
async function kdf_rk(rk, dhOut) {
  const out = await hkdf(rk, dhOut, "WhisperRatchet", 64);
  return { newRoot: out.slice(0, 32), newChain: out.slice(32, 64) };
}

// KDF для цепочки: chainKey -> (newChainKey, messageKey)
async function kdf_ck(ck) {
  const out = await hkdf(new Uint8Array(32), ck, "WhisperMessageKeys", 64);
  return { newChain: out.slice(0, 32), messageKey: out.slice(32, 64) };
}

// Шифрование сообщения с AES-GCM
async function encryptMessage(key, plaintext, nonce = null) {
  const iv = nonce || crypto.getRandomValues(new Uint8Array(12));
  const cryptoKey = await crypto.subtle.importKey(
    "raw",
    key,
    { name: "AES-GCM" },
    false,
    ["encrypt"]
  );
  const encoded = new TextEncoder().encode(plaintext);
  const ciphertext = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv: iv },
    cryptoKey,
    encoded
  );
  return { ciphertext: new Uint8Array(ciphertext), iv };
}

// Дешифрование
async function decryptMessage(key, ciphertext, iv) {
  const cryptoKey = await crypto.subtle.importKey(
    "raw",
    key,
    { name: "AES-GCM" },
    false,
    ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: iv },
    cryptoKey,
    ciphertext
  );
  return new TextDecoder().decode(plain);
}

// ===== Управление сессиями =====
// Инициализация сессии как инициатор (отправляем первое сообщение)
async function initSessionAsInitiator(chatId, theirIdentityPublicKeyJWK) {
  // Импортируем публичный ключ собеседника
  const theirPub = await crypto.subtle.importKey(
    "jwk",
    theirIdentityPublicKeyJWK,
    { name: "ECDH", namedCurve: "P-256" },
    false,
    []
  );
  // Генерируем эфемерную пару
  const ephemeralPair = await generateECDHKeyPair();
  const sharedSecret = await dh(ephemeralPair.privateKey, theirPub);
  const rootKey = await hkdf(new Uint8Array(32), sharedSecret, "DoubleRatchetRoot", 32);
  const chainKey = await hkdf(rootKey, new Uint8Array(32), "DoubleRatchetChain", 32);
  
  drSessions[chatId] = {
    rootKey: rootKey,
    sendChainKey: chainKey,
    recvChainKey: null,      // пока не получали
    sendCounter: 0,
    recvCounter: 0,
    prevCounter: 0,
    remotePublicKey: theirPub,         // публичный ключ собеседника (identity)
    localPublicKey: ephemeralPair.publicKey,
    localPrivateKey: ephemeralPair.privateKey,
    remoteIdentityKey: theirPub,
    identityKey: myIdentityKeyPair.publicKey,
    identityPrivateKey: myIdentityKeyPair.privateKey
  };
  return drSessions[chatId];
}

// Инициализация как получатель (получено первое сообщение с dh_pub от отправителя)
async function initSessionAsReceiver(chatId, theirEphemeralPublicKeyJWK) {
  const theirPub = await crypto.subtle.importKey(
    "jwk",
    theirEphemeralPublicKeyJWK,
    { name: "ECDH", namedCurve: "P-256" },
    false,
    []
  );
  // Используем наш identity private key для DH
  const sharedSecret = await dh(myIdentityKeyPair.privateKey, theirPub);
  const rootKey = await hkdf(new Uint8Array(32), sharedSecret, "DoubleRatchetRoot", 32);
  const chainKey = await hkdf(rootKey, new Uint8Array(32), "DoubleRatchetChain", 32);
  
  drSessions[chatId] = {
    rootKey: rootKey,
    sendChainKey: null,
    recvChainKey: chainKey,
    sendCounter: 0,
    recvCounter: 0,
    prevCounter: 0,
    remotePublicKey: theirPub,
    localPublicKey: myIdentityKeyPair.publicKey,
    localPrivateKey: myIdentityKeyPair.privateKey,
    remoteIdentityKey: theirPub,
    identityKey: myIdentityKeyPair.publicKey,
    identityPrivateKey: myIdentityKeyPair.privateKey
  };
  return drSessions[chatId];
}

// Отправить сообщение через DR
async function sendDR(chatId, plaintext) {
  let session = drSessions[chatId];
  if (!session) {
    // Нужно получить публичный ключ собеседника из таблицы users
    const theirPubJWK = await getUserPublicKey(currentUser);
    if (!theirPubJWK) throw new Error("No public key for recipient");
    session = await initSessionAsInitiator(chatId, theirPubJWK);
  }
  
  // Получаем ключ для этого сообщения
  let { newChain, messageKey } = await kdf_ck(session.sendChainKey);
  session.sendChainKey = newChain;
  const msgKey = messageKey;
  
  // Генерируем случайный nonce
  const nonce = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await encryptMessage(msgKey, plaintext, nonce);
  
  // Возвращаем данные для отправки
  const result = {
    data: btoa(String.fromCharCode(...cipher.ciphertext)),
    iv: Array.from(nonce),
    n: session.sendCounter,
    pn: session.prevCounter,
    dh_pub: null
  };
  
  // Если нужно обновить цепочку (каждые 10 сообщений или в начале)
  if (session.sendCounter === 0 || (session.sendCounter + 1) % 10 === 0) {
    // Генерируем новый эфемерный ключ для смены цепочки
    const newEphemeral = await generateECDHKeyPair();
    const newShared = await dh(newEphemeral.privateKey, session.remoteIdentityKey);
    const { newRoot, newChain: newChainFromRK } = await kdf_rk(session.rootKey, newShared);
    session.rootKey = newRoot;
    session.prevCounter = session.sendCounter;
    session.sendCounter = 0;
    session.sendChainKey = newChainFromRK;
    // Экспортируем новый публичный ключ для отправки
    const jwk = await crypto.subtle.exportKey("jwk", newEphemeral.publicKey);
    result.dh_pub = JSON.stringify(jwk);
    // Сохраняем локальный ключ для будущих сообщений (при получении ответа)
    session.localPublicKey = newEphemeral.publicKey;
    session.localPrivateKey = newEphemeral.privateKey;
  } else {
    session.sendCounter++;
  }
  return result;
}

// Получить сообщение через DR
async function receiveDR(chatId, encrypted, iv, dh_pub, n, pn) {
  let session = drSessions[chatId];
  if (!session) {
    if (!dh_pub) throw new Error("First message must contain dh_pub");
    session = await initSessionAsReceiver(chatId, JSON.parse(dh_pub));
  }
  
  // Обработка смены цепочки, если пришёл новый публичный ключ
  if (dh_pub) {
    const theirEphemeral = await crypto.subtle.importKey(
      "jwk",
      JSON.parse(dh_pub),
      { name: "ECDH", namedCurve: "P-256" },
      false,
      []
    );
    // Вычисляем новый общий секрет между нашим identity и их эфемерным
    const shared = await dh(session.identityPrivateKey, theirEphemeral);
    const { newRoot, newChain } = await kdf_rk(session.rootKey, shared);
    session.rootKey = newRoot;
    session.prevCounter = pn;
    session.sendCounter = 0;
    session.sendChainKey = newChain;
    // Обновляем recvCounter и цепочку приёма
    session.recvCounter = 0;
    session.recvChainKey = await kdf_ck(newChain).then(res => res.newChain);
    // Сохраняем их публичный ключ для будущих ответов
    session.remotePublicKey = theirEphemeral;
  }
  
  // Пропуск сообщений, если n > recvCounter
  let mk = null;
  let ck = session.recvChainKey;
  for (let i = session.recvCounter; i <= n; i++) {
    const { newChain, messageKey } = await kdf_ck(ck);
    ck = newChain;
    if (i === n) mk = messageKey;
  }
  session.recvChainKey = ck;
  session.recvCounter = n + 1;
  
  const plaintext = await decryptMessage(mk, new Uint8Array(atob(encrypted).split('').map(c => c.charCodeAt(0))), new Uint8Array(iv));
  return JSON.parse(plaintext);
}

// ===== Вспомогательные функции для работы с Supabase =====
async function getUserPublicKey(username) {
  const r = await fetch(`${URL}/rest/v1/users?name=eq.${encodeURIComponent(username)}`, {
    headers: { apikey: KEY }
  });
  const users = await r.json();
  if (users.length === 0) return null;
  return JSON.parse(users[0].pubkey);
}

async function hashStr(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function getChatId(a, b) {
  return (await hashStr([a, b].sort().join("|"))).slice(0, 32);
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function trimReplyChain(r, depth = 0) {
  if (!r || depth > 2) return null;
  return {
    id: r.id,
    from: r.from,
    text: r.text,
    replyTo: trimReplyChain(r.replyTo, depth + 1)
  };
}

// ===== Основные функции мессенджера =====
async function start() {
  myName = document.getElementById("name").value || "anon";
  myId = (await hashStr(myName)).slice(0, 32);
  
  // Генерация ключей
  myIdentityKeyPair = await generateECDHKeyPair();
  const pubJWK = await crypto.subtle.exportKey("jwk", myIdentityKeyPair.publicKey);
  
  // Публикация в Supabase
  await fetch(URL + "/rest/v1/users", {
    method: "POST",
    headers: {
      apikey: KEY,
      "Content-Type": "application/json",
      "Prefer": "resolution=merge-duplicates"
    },
    body: JSON.stringify({
      id: myId,
      name: myName,
      pubkey: JSON.stringify(pubJWK),
      prekey: JSON.stringify(pubJWK),
      last_seen: Date.now()
    })
  });
  
  loadUsers();
  setInterval(loadUsers, 3000);
  poll();
  alert("READY " + myName);
}

async function loadUsers() {
  const r = await fetch(URL + "/rest/v1/users", { headers: { apikey: KEY } });
  const list = await r.json();
  const el = document.getElementById("users");
  el.innerHTML = "";
  list.forEach(u => {
    if (u.id === myId) return;
    const d = document.createElement("div");
    d.className = "user";
    d.innerText = u.name;
    d.onclick = () => { currentUser = u.name; loadHistory(); };
    el.appendChild(d);
  });
}

async function send() {
  if (!currentUser) return;
  const text = document.getElementById("msg").value;
  const chatId = await getChatId(myName, currentUser);
  
  let msg = {
    id: crypto.randomUUID(),
    from: myName,
    text,
    time: Date.now(),
    type: "text",
    replyTo: replyTo ? trimReplyChain(replyTo) : null,
    forwardFrom: forwardMsg ? forwardMsg.from : null
  };
  
  render(msg, true);
  
  const plain = JSON.stringify(msg);
  const encrypted = await sendDR(chatId, plain);
  
  await fetch(URL + "/rest/v1/messages", {
    method: "POST",
    headers: { apikey: KEY, "Content-Type": "application/json" },
    body: JSON.stringify({
      recipient: chatId,
      sender: myName,
      data: encrypted.data,
      iv: encrypted.iv,
      dh_pub: encrypted.dh_pub,
      n: encrypted.n,
      pn: encrypted.pn
    })
  });
  
  document.getElementById("msg").value = "";
  clearReply();
  clearForward();
}

async function sendReaction(emoji) {
  if (!reactionTarget) return;
  const chatId = await getChatId(myName, currentUser);
  const msg = {
    id: crypto.randomUUID(),
    type: "reaction",
    target: reactionTarget,
    emoji,
    from: myName,
    time: Date.now()
  };
  const plain = JSON.stringify(msg);
  const encrypted = await sendDR(chatId, plain);
  await fetch(URL + "/rest/v1/messages", {
    method: "POST",
    headers: { apikey: KEY, "Content-Type": "application/json" },
    body: JSON.stringify({
      recipient: chatId,
      sender: myName,
      data: encrypted.data,
      iv: encrypted.iv,
      dh_pub: encrypted.dh_pub,
      n: encrypted.n,
      pn: encrypted.pn
    })
  });
  document.getElementById("emojiPicker").style.display = "none";
}

function applyReaction(r) {
  const key = r.target + "_" + r.from + "_" + r.emoji;
  if (reactionDedup.has(key)) return;
  reactionDedup.add(key);
  if (!reactionsMap[r.target]) reactionsMap[r.target] = {};
  if (!reactionsMap[r.target][r.emoji]) reactionsMap[r.target][r.emoji] = 0;
  reactionsMap[r.target][r.emoji]++;
}

function updateReactionsUI() {
  document.querySelectorAll("[data-id]").forEach(el => {
    const id = el.dataset.id;
    const r = reactionsMap[id];
    if (!r) return;
    let text = "";
    for (let e in r) {
      text += e + " " + r[e] + " ";
    }
    let box = el.querySelector(".reactions");
    if (!box) {
      box = document.createElement("div");
      box.className = "reactions";
      el.appendChild(box);
    }
    box.innerText = text;
  });
}

async function loadHistory() {
  reactionsMap = {};
  reactionDedup.clear();
  seen.clear();
  const chatId = await getChatId(myName, currentUser);
  const r = await fetch(URL + "/rest/v1/messages?recipient=eq." + chatId, { headers: { apikey: KEY } });
  const list = await r.json();
  document.getElementById("chat").innerHTML = "";
  for (const m of list) {
    seen.add(m.id);
    try {
      const msg = await receiveDR(chatId, m.data, m.iv, m.dh_pub, m.n, m.pn);
      if (msg.type === "reaction") {
        applyReaction(msg);
      } else {
        render(msg, msg.from === myName);
      }
    } catch (e) {
      console.warn("Failed to decrypt message", m.id, e);
    }
  }
  updateReactionsUI();
}

function poll() {
  setInterval(async () => {
    if (!currentUser) return;
    const chatId = await getChatId(myName, currentUser);
    const r = await fetch(URL + "/rest/v1/messages?recipient=eq." + chatId, { headers: { apikey: KEY } });
    const list = await r.json();
    for (const m of list) {
      if (seen.has(m.id)) continue;
      seen.add(m.id);
      try {
        const msg = await receiveDR(chatId, m.data, m.iv, m.dh_pub, m.n, m.pn);
        if (msg.type === "reaction") {
          applyReaction(msg);
          updateReactionsUI();
        } else {
          render(msg, msg.from === myName);
        }
      } catch (e) {
        console.warn("Poll decrypt error", m.id, e);
      }
    }
  }, 1500);
}

// ===== UI =====
function showPicker(id) {
  reactionTarget = id;
  const picker = document.getElementById("emojiPicker");
  picker.innerHTML = "";
  EMOJIS.forEach(e => {
    const span = document.createElement("span");
    span.innerText = e;
    span.onclick = () => sendReaction(e);
    picker.appendChild(span);
  });
  picker.style.display = "block";
}

function render(m, me) {
  const d = document.createElement("div");
  d.className = "msg " + (me ? "me" : "peer");
  d.dataset.id = m.id;
  d.onclick = () => setReply(m);
  d.oncontextmenu = (e) => { e.preventDefault(); setForward(m); };
  
  const btn = document.createElement("div");
  btn.className = "reactBtn";
  btn.innerText = "🙂";
  btn.onclick = (e) => { e.stopPropagation(); showPicker(m.id); };
  d.appendChild(btn);
  
  if (m.forwardFrom) {
    const f = document.createElement("div");
    f.className = "forwardBox";
    f.innerText = "Forwarded from " + m.forwardFrom;
    d.appendChild(f);
  }
  
  if (m.replyTo) {
    renderReplyChain(d, m.replyTo);
  }
  
  const text = document.createElement("div");
  text.innerText = m.from + ": " + m.text;
  const time = document.createElement("div");
  time.className = "time";
  time.innerText = formatTime(m.time);
  d.appendChild(text);
  d.appendChild(time);
  document.getElementById("chat").appendChild(d);
}

function renderReplyChain(container, r, level = 0) {
  if (!r) return;
  const div = document.createElement("div");
  div.className = "replyBox";
  div.style.marginLeft = (level * 8) + "px";
  div.innerText = r.from + ": " + r.text;
  container.appendChild(div);
  renderReplyChain(container, r.replyTo, level + 1);
}

function setReply(m) {
  replyTo = m;
  const el = document.getElementById("replyPreview");
  el.style.display = "block";
  el.innerText = "Reply: " + m.from + ": " + m.text;
}

function clearReply() {
  replyTo = null;
  document.getElementById("replyPreview").style.display = "none";
}

function setForward(m) {
  forwardMsg = m;
  const el = document.getElementById("forwardPreview");
  el.style.display = "block";
  el.innerText = "Forward: " + m.from + ": " + m.text;
}

function clearForward() {
  forwardMsg = null;
  document.getElementById("forwardPreview").style.display = "none";
}
</script>
