<script>

const URL="https://ubfytoriwbhglblxdzto.supabase.co"
const KEY="sb_publishable_vd185mW1MiBYYxKZg1HwRg_pOuAWq72"

function log(x){
  document.getElementById("log").textContent += "\n"+x

// 🔥 ПРОСТЕЙШИЙ ТЕСТ
async function testInsert(){

  log("TEST INSERT START")

  try{

    const res = await fetch(URL+"/rest/v1/messages",{
      method:"POST",
      headers:{
        apikey:KEY,
        "Content-Type":"application/json",
        "Prefer":"return=representation"
      },
      body: JSON.stringify({
        recipient:"debug",
        sender:"browser",
        data:[1,2,3],
        iv:[1,2,3]
      })
    })

    log("STATUS: "+res.status)

    const text = await res.text()
    log("RESPONSE: "+text)

  }catch(e){
    log("ERROR: "+e)
  }
}

// 🔥 ИМИТАЦИЯ ТВОЕГО КОДА
