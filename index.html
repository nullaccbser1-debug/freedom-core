<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Anon Signal V48 — Full Double Ratchet</title>

<style>
body { margin:0; font-family:system-ui; background:#111; color:white; }
#app { display:flex; height:100vh; }

#sidebar { width:240px; background:#1e1e1e; padding:10px; }

input,button {
  width:100%;
  margin:5px 0;
  padding:8px;
}

.user { padding:8px; cursor:pointer; }
.user:hover { background:#333; }

#chat {
  flex:1;
  overflow:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
}

.msg {
  max-width:70%;
  margin:6px;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  position:relative;
}

.me { background:#0af; margin-left:auto; }
.peer { background:#333; }

.time { font-size:10px; opacity:0.6; text-align:right; }

.replyBox {
  border-left:3px solid #0af;
  padding-left:6px;
  margin-bottom:4px;
  font-size:12px;
  opacity:0.8;
}

.forwardBox { font-size:11px; opacity:0.6; margin-bottom:4px; }

.reactions { margin-top:4px; font-size:13px; }

.reactBtn {
  position:absolute;
  right:6px;
  top:6px;
  font-size:14px;
  opacity:0.6;
  cursor:pointer;
}

#emojiPicker {
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  padding:10px;
  border-radius:10px;
  display:none;
}

#emojiPicker span {
  font-size:20px;
  margin:5px;
  cursor:pointer;
}

#replyPreview, #forwardPreview {
  background:#222;
  padding:6px;
  font-size:12px;
  display:none;
}

#mode { font-size:12px; opacity:0.7; }
</style>
</head>
<body>

<div id="app">

<div id="sidebar">
  <input id="name" placeholder="Your name">
  <button onclick="start()">Start</button>
  <div id="mode"></div>
  <div id="users"></div>
  <button onclick="exportKeys()" style="background:#0a0">Export Keys</button>
  <button onclick="document.getElementById('importFile').click()" style="background:#a00">Import Keys</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importKeys(event)">
</div>

<div style="flex:1; display:flex; flex-direction:column;">
  <div id="chat"></div>

  <div id="replyPreview"></div>
  <div id="forwardPreview"></div>

  <div style="display:flex;">
    <input id="msg">
    <button onclick="send()">➤</button>
  </div>
</div>

</div>

<div id="emojiPicker"></div>

<script>
// ===== REDIRECT ===== СОХРАНИТЬ, НЕ ТРОГАТЬ!
const ONLINE_URL = "https://nullaccbser1-debug.github.io/freedom-core/"
if(location.protocol==="file:"||location.protocol==="content:"){
  setTimeout(()=>location.href=ONLINE_URL,700)
}
document.getElementById("mode").innerText =
  location.protocol==="http:"||location.protocol==="https:"
  ? "🟢 ONLINE (Full Double Ratchet)" : "🟡 LOCAL"

// ===== CONFIG =====
const URL="https://ubfytoriwbhglblxdzto.supabase.co"
const KEY="sb_publishable_vd185mW1MiBYYxKZg1HwRg_pOuAWq72"

let myName,myId,currentUser=null
let seen=new Set()
let replyTo=null
let forwardMsg=null

let reactionsMap={}
let reactionTarget=null
let reactionDedup=new Set()
let keypair
  
const EMOJIS=["👍","🔥","😂","❤️","😮","😢"]

// ===== CRYPTO CORE — FULL DOUBLE RATCHET =====
let sessions = JSON.parse(localStorage.getItem("sessions")||"{}")

function saveSessions(){
  localStorage.setItem("sessions", JSON.stringify(sessions))
}

async function kdf(input){
  const buf=await crypto.subtle.digest("SHA-256", input)
  return new Uint8Array(buf)
}

async function loadOrCreateKeypair(){
  const saved = localStorage.getItem("identityKey")
  if(saved){
    const jwk = JSON.parse(saved)
    const pub = await crypto.subtle.importKey("jwk", jwk.public, {name:"ECDH",namedCurve:"P-256"}, true, [])
    const priv = await crypto.subtle.importKey("jwk", jwk.private, {name:"ECDH",namedCurve:"P-256"}, true, ["deriveBits","deriveKey"])
    return {publicKey: pub, privateKey: priv}
  }
  const kp = await crypto.subtle.generateKey({name:"ECDH", namedCurve:"P-256"}, true, ["deriveBits","deriveKey"])
  const pubJWK = await crypto.subtle.exportKey("jwk", kp.publicKey)
  const privJWK = await crypto.subtle.exportKey("jwk", kp.privateKey)
  localStorage.setItem("identityKey", JSON.stringify({public: pubJWK, private: privJWK}))
  return kp
}

async function generateEphemeral(){
  return await crypto.subtle.generateKey({name:"ECDH", namedCurve:"P-256"}, true, ["deriveBits","deriveKey"])
}

// ===== X3DH + Double Ratchet INIT =====
async function initSession(user){
  if(sessions[user]) return sessions[user]

  const id=(await hashStr(user)).slice(0,32)
  const r=await fetch(URL+"/rest/v1/users?id=eq."+id,{headers:{apikey:KEY}})
  if (!r.ok) return null
  const d=await r.json()
  if(!d[0]) return null

  const remotePub=await crypto.subtle.importKey("jwk", JSON.parse(d[0].pubkey), {name:"ECDH",namedCurve:"P-256"}, true, [])

  const shared=await crypto.subtle.deriveBits({name:"ECDH",public:remotePub}, keypair.privateKey, 256)
  const root = await kdf(shared)

  const initialEphemeral = await generateEphemeral()
  const ephemeralPubJWK = await crypto.subtle.exportKey("jwk", initialEphemeral.publicKey)
  const ephemeralPrivJWK = await crypto.subtle.exportKey("jwk", initialEphemeral.privateKey)

  sessions[user]={
    rootKey:Array.from(root),
    sendChain:Array.from(root),
    recvChain:Array.from(root),
    Ns:0,
    Nr:0,
    ourEphemeralPriv: ephemeralPrivJWK,   // для следующего DH-ratchet
    theirLastDHPub: null
  }

  saveSessions()
  return sessions[user]
}

// ===== ENCRYPT (Double Ratchet) =====
async function encrypt(chatId, msg){
  let s = await initSession(currentUser)
  if(!s) throw new Error(`Нет сессии с ${currentUser}`)

  // === DH-RATCHET ===
  let newRoot = new Uint8Array(s.rootKey)
  const newEphemeral = await generateEphemeral()
  const newDHPub = await crypto.subtle.exportKey("jwk", newEphemeral.publicKey)

  if(s.theirLastDHPub){
    const remote = await crypto.subtle.importKey("jwk", s.theirLastDHPub, {name:"ECDH",namedCurve:"P-256"}, true, [])
    const shared = await crypto.subtle.deriveBits({name:"ECDH",public:remote}, newEphemeral.privateKey, 256)
    const dh = await kdf(shared)
    newRoot = await kdf(new Uint8Array([...s.rootKey, ...dh]))
  }

  s.rootKey = Array.from(newRoot)
  s.ourEphemeralPriv = await crypto.subtle.exportKey("jwk", newEphemeral.privateKey)

  // === SYMMETRIC RATCHET ===
  let chain = new Uint8Array(s.sendChain)
  chain = await kdf(chain)
  s.sendChain = Array.from(chain)
  s.Ns++

  const key = await crypto.subtle.importKey("raw", chain, "AES-GCM", false, ["encrypt"])
  const iv=crypto.getRandomValues(new Uint8Array(12))
  const enc=new TextEncoder().encode(JSON.stringify(msg))
  const cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc)

  saveSessions()

  return {
    data:btoa(String.fromCharCode(...new Uint8Array(cipher))),
    iv:Array.from(iv),
    dh_pub: newDHPub,
    n:s.Ns,
    pn:s.Nr
  }
}

// ===== DECRYPT (Double Ratchet) =====
async function decrypt(chatId, data, iv, payload){
  let s = await initSession(currentUser)
  if(!s) {
    console.warn(`Нет сессии с ${currentUser}`)
    return null
  }

  // === DH-RATCHET если пришёл новый ephemeral pub ===
  if(payload.dh_pub){
    const remote = await crypto.subtle.importKey("jwk", payload.dh_pub, {name:"ECDH",namedCurve:"P-256"}, true, [])
    const ourEphem = await crypto.subtle.importKey("jwk", s.ourEphemeralPriv, {name:"ECDH",namedCurve:"P-256"}, true, ["deriveBits"])
    const shared = await crypto.subtle.deriveBits({name:"ECDH",public:remote}, ourEphem, 256)
    const dh = await kdf(shared)
    const newRoot = await kdf(new Uint8Array([...s.rootKey, ...dh]))

    s.rootKey = Array.from(newRoot)
    s.theirLastDHPub = payload.dh_pub

    // генерируем новый ephemeral для следующего отправления
    const newEphem = await generateEphemeral()
    s.ourEphemeralPriv = await crypto.subtle.exportKey("jwk", newEphem.privateKey)
  }

  // === SYMMETRIC RATCHET ===
  let chain=new Uint8Array(s.recvChain)
  chain=await kdf(chain)
  s.recvChain=Array.from(chain)
  s.Nr++

  const key=await crypto.subtle.importKey("raw",chain,"AES-GCM",false,["decrypt"])

  try{
    const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0))
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(iv)},key,bytes)
    saveSessions()
    return JSON.parse(new TextDecoder().decode(plain))
  }catch(e){
    console.warn("Decrypt failed", e)
    return null
  }
}

// ===== UTILS =====
async function hashStr(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str))
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("")
}

async function getChatId(a,b){
  return (await hashStr([a,b].sort().join("|"))).slice(0,32)
}

function formatTime(ts){
  return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
}

function trimReplyChain(r, depth=0){
  if(!r || depth>2) return null
  return {id:r.id, from:r.from, text:r.text, replyTo: trimReplyChain(r.replyTo, depth+1)}
}

// ===== START =====
async function start(){
  myName=document.getElementById("name").value||"anon"
  myId=(await hashStr(myName)).slice(0,32)

  keypair = await loadOrCreateKeypair()
  
  await publish()
  loadUsers()
  setInterval(loadUsers,3000)
  poll()

  alert("READY "+myName+" — Full Double Ratchet active")
}

// ===== EXPORT / IMPORT KEYS (для разных устройств) =====
function exportKeys(){
  const data = {
    identityKey: localStorage.getItem("identityKey"),
    sessions: localStorage.getItem("sessions")
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"})
  const url = URL.createObjectURL(blob)
  const a = document.createElement("a")
  a.href = url
  a.download = "signal-keys.json"
  a.click()
  URL.revokeObjectURL(url)
}

async function importKeys(e){
  const file = e.target.files[0]
  if(!file) return
  const text = await file.text()
  const data = JSON.parse(text)
  if(data.identityKey) localStorage.setItem("identityKey", data.identityKey)
  if(data.sessions) localStorage.setItem("sessions", data.sessions)
  alert("Ключи импортированы! Перезагрузите страницу.")
  location.reload()
}

// ===== USERS & PUBLISH =====
async function loadUsers(){
  const r=await fetch(URL+"/rest/v1/users",{headers:{apikey:KEY}})
  const list=await r.json()
  const el=document.getElementById("users")
  el.innerHTML=""
  list.forEach(u=>{
    if(u.id===myId) return
    const d=document.createElement("div")
    d.className="user"
    d.innerText=u.name
    d.onclick=()=>{currentUser=u.name;loadHistory()}
    el.appendChild(d)
  })
}

async function publish(){
  const pub = await crypto.subtle.exportKey("jwk", keypair.publicKey)
  await fetch(URL+"/rest/v1/users",{
    method:"POST",
    headers:{apikey:KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
    body:JSON.stringify({id:myId,name:myName,pubkey:JSON.stringify(pub),prekey:JSON.stringify(pub),last_seen:Date.now()})
  })
}

// ===== SEND, REACTIONS, HISTORY, POLL, UI (без изменений) =====
async function send(){
  if(!currentUser) return
  const text=document.getElementById("msg").value
  const chatId=await getChatId(myName,currentUser)
  let msg={id:crypto.randomUUID(),from:myName,text,time:Date.now(),type:"text",replyTo:replyTo?trimReplyChain(replyTo):null,forwardFrom:forwardMsg?forwardMsg.from:null}
  render(msg,true)
  try {
    const enc=await encrypt(chatId,msg)
    await fetch(URL+"/rest/v1/messages",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({recipient:chatId,sender:myName,data:enc.data,iv:enc.iv,dh_pub:enc.dh_pub,n:enc.n,pn:enc.pn})})
  } catch(e){ console.error("Send error:",e); alert("Ошибка отправки: "+e.message); return }
  document.getElementById("msg").value=""
  clearReply()
  clearForward()
}

async function sendReaction(emoji){
  if(!reactionTarget) return
  const chatId=await getChatId(myName,currentUser)
  const msg={id:crypto.randomUUID(),type:"reaction",target:reactionTarget,emoji,from:myName,time:Date.now()}
  try {
    const enc=await encrypt(chatId,msg)
    await fetch(URL+"/rest/v1/messages",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({recipient:chatId,sender:myName,data:enc.data,iv:enc.iv,dh_pub:enc.dh_pub,n:enc.n,pn:enc.pn})})
    applyReaction(msg)
    updateReactionsUI()
  } catch(e){ console.error("Reaction error:",e); alert("Ошибка реакции: "+e.message) }
  document.getElementById("emojiPicker").style.display="none"
}

function applyReaction(r){
  const key=r.target+"_"+r.from+"_"+r.emoji
  if(reactionDedup.has(key)) return
  reactionDedup.add(key)
  if(!reactionsMap[r.target]) reactionsMap[r.target]={}
  if(!reactionsMap[r.target][r.emoji]) reactionsMap[r.target][r.emoji]=0
  reactionsMap[r.target][r.emoji]++
}

function updateReactionsUI(){
  document.querySelectorAll("[data-id]").forEach(el=>{
    const id=el.dataset.id; const r=reactionsMap[id]
    if(!r) return
    let text=""; for(let e in r) text+=e+" "+r[e]+" "
    let box=el.querySelector(".reactions")
    if(!box){ box=document.createElement("div"); box.className="reactions"; el.appendChild(box) }
    box.innerText=text
  })
}

async function loadHistory(){
  reactionsMap={}; reactionDedup.clear(); seen.clear()
  const chatId=await getChatId(myName,currentUser)
  const r=await fetch(URL+"/rest/v1/messages?recipient=eq."+chatId,{headers:{apikey:KEY}})
  const list=await r.json()
  document.getElementById("chat").innerHTML=""
  for(const m of list){
    seen.add(m.id)
    const msg=await decrypt(chatId,m.data,m.iv,m)
    if(!msg) continue
    if(msg.type==="reaction"){ applyReaction(msg) } else { render(msg,msg.from===myName) }
  }
  updateReactionsUI()
}

function poll(){
  setInterval(async()=>{
    if(!currentUser) return
    const chatId=await getChatId(myName,currentUser)
    const r=await fetch(URL+"/rest/v1/messages?recipient=eq."+chatId,{headers:{apikey:KEY}})
    const list=await r.json()
    for(const m of list){
      if(seen.has(m.id)) continue
      seen.add(m.id)
      const msg=await decrypt(chatId,m.data,m.iv,m)
      if(!msg) continue
      if(msg.type==="reaction"){ applyReaction(msg); updateReactionsUI() } else { render(msg,msg.from===myName) }
    }
  },1500)
}

function showPicker(id){
  reactionTarget=id
  const picker=document.getElementById("emojiPicker")
  picker.innerHTML=""
  EMOJIS.forEach(e=>{
    const span=document.createElement("span")
    span.innerText=e
    span.onclick=()=>sendReaction(e)
    picker.appendChild(span)
  })
  picker.style.display="block"
}

function render(m,me){
  const d=document.createElement("div")
  d.className="msg "+(me?"me":"peer")
  d.dataset.id=m.id
  d.onclick=()=>setReply(m)
  d.oncontextmenu=(e)=>{e.preventDefault();setForward(m)}
  const btn=document.createElement("div")
  btn.className="reactBtn"
  btn.innerText="🙂"
  btn.onclick=(e)=>{e.stopPropagation();showPicker(m.id)}
  d.appendChild(btn)
  if(m.forwardFrom){
    const f=document.createElement("div")
    f.className="forwardBox"
    f.innerText="Forwarded from "+m.forwardFrom
    d.appendChild(f)
  }
  if(m.replyTo) renderReplyChain(d, m.replyTo)
  const text=document.createElement("div")
  text.innerText=m.from+": "+m.text
  const time=document.createElement("div")
  time.className="time"
  time.innerText=formatTime(m.time)
  d.appendChild(text)
  d.appendChild(time)
  document.getElementById("chat").appendChild(d)
}

function renderReplyChain(container, r, level=0){
  if(!r) return
  const div=document.createElement("div")
  div.className="replyBox"
  div.style.marginLeft = (level*8)+"px"
  div.innerText=r.from+": "+r.text
  container.appendChild(div)
  renderReplyChain(container, r.replyTo, level+1)
}

function setReply(m){
  replyTo=m
  const el=document.getElementById("replyPreview")
  el.style.display="block"
  el.innerText="Reply: "+m.from+": "+m.text
}

function clearReply(){
  replyTo=null
  document.getElementById("replyPreview").style.display="none"
}

function setForward(m){
  forwardMsg=m
  const el=document.getElementById("forwardPreview")
  el.style.display="block"
  el.innerText="Forward: "+m.from+": "+m.text
}

function clearForward(){
  forwardMsg=null
  document.getElementById("forwardPreview").style.display="none"
}
</script>
</body>
</html>
