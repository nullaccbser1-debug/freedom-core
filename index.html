<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Anon Signal V47</title>

<style>
body { margin:0; font-family:system-ui; background:#111; color:white; }
#app { display:flex; height:100vh; }

#sidebar { width:240px; background:#1e1e1e; padding:10px; }

input,button {
  width:100%;
  margin:5px 0;
  padding:8px;
}

.user { padding:8px; cursor:pointer; }
.user:hover { background:#333; }

#chat {
  flex:1;
  overflow:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
}

.msg {
  max-width:70%;
  margin:6px;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  position:relative;
}

.me { background:#0af; margin-left:auto; }
.peer { background:#333; }

.time { font-size:10px; opacity:0.6; text-align:right; }

.replyBox {
  border-left:3px solid #0af;
  padding-left:6px;
  margin-bottom:4px;
  font-size:12px;
  opacity:0.8;
}

.forwardBox { font-size:11px; opacity:0.6; margin-bottom:4px; }

.reactions { margin-top:4px; font-size:13px; }

.reactBtn {
  position:absolute;
  right:6px;
  top:6px;
  font-size:14px;
  opacity:0.6;
  cursor:pointer;
}

#emojiPicker {
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  padding:10px;
  border-radius:10px;
  display:none;
}

#emojiPicker span {
  font-size:20px;
  margin:5px;
  cursor:pointer;
}

#replyPreview, #forwardPreview {
  background:#222;
  padding:6px;
  font-size:12px;
  display:none;
}

#mode { font-size:12px; opacity:0.7; }
</style>
</head>
<body>

<div id="app">

<div id="sidebar">
  <input id="name" placeholder="Your name">
  <button onclick="start()">Start</button>
  <div id="mode"></div>
  <div id="users"></div>
</div>

<div style="flex:1; display:flex; flex-direction:column;">
  <div id="chat"></div>

  <div id="replyPreview"></div>
  <div id="forwardPreview"></div>

  <div style="display:flex;">
    <input id="msg">
    <button onclick="send()">➤</button>
  </div>
</div>

</div>

<div id="emojiPicker"></div>

<script>
// ===== REDIRECT ===== СОХРАНИТЬ, НЕ ТРОГАТЬ!
const ONLINE_URL = "https://nullaccbser1-debug.github.io/freedom-core/"
if(location.protocol==="file:"||location.protocol==="content:"){
  setTimeout(()=>location.href=ONLINE_URL,700)
}
document.getElementById("mode").innerText =
  location.protocol==="http:"||location.protocol==="https:"
  ? "🟢 ONLINE" : "🟡 LOCAL"
  
// ===== CONFIG =====
const URL="https://ubfytoriwbhglblxdzto.supabase.co"
const KEY="sb_publishable_vd185mW1MiBYYxKZg1HwRg_pOuAWq72"

let myName,myId,currentUser=null
let seen=new Set()
let replyTo=null
let forwardMsg=null

let reactionsMap={}
let reactionTarget=null
let reactionDedup=new Set()
let keypair
  
const EMOJIS=["👍","🔥","😂","❤️","😮","😢"]

// ===== CRYPTO CORE =====

let sessions = JSON.parse(localStorage.getItem("sessions")||"{}")

function saveSessions(){
  localStorage.setItem("sessions", JSON.stringify(sessions))
}

async function kdf(input){
  const buf=await crypto.subtle.digest("SHA-256", input)
  return new Uint8Array(buf)
}

// ===== X3DH INIT =====

async function initSession(user){

  if(sessions[user]) return sessions[user]

  const id=(await hashStr(user)).slice(0,32)

  const r=await fetch(URL+"/rest/v1/users?id=eq."+id,{headers:{apikey:KEY}})
  const d=await r.json()
  if(!d[0]) return

  const remotePub=await crypto.subtle.importKey(
    "jwk",
    JSON.parse(d[0].pubkey),
    {name:"ECDH",namedCurve:"P-256"},
    true, []
  )

  const shared=await crypto.subtle.deriveBits(
    {name:"ECDH",public:remotePub},
    keypair.privateKey,
    256
  )

  const root = await kdf(shared)

  sessions[user]={
    rootKey:Array.from(root),
    sendChain:Array.from(root),
    recvChain:Array.from(root),
    Ns:0,
    Nr:0
  }

  saveSessions()
  return sessions[user]
}

// ===== ENCRYPT =====

async function encrypt(chatId, msg){

  const s = await initSession(currentUser)

  let chain = new Uint8Array(s.sendChain)
  chain = await kdf(chain)
  s.sendChain = Array.from(chain)
  s.Ns++

  const key = await crypto.subtle.importKey("raw", chain, "AES-GCM", false, ["encrypt"])

  const iv=crypto.getRandomValues(new Uint8Array(12))
  const enc=new TextEncoder().encode(JSON.stringify(msg))

  const cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc)

  saveSessions()

  return {
    data:btoa(String.fromCharCode(...new Uint8Array(cipher))),
    iv:Array.from(iv),
    dh_pub: await crypto.subtle.exportKey("jwk", keypair.publicKey),
    n:s.Ns,
    pn:s.Nr
  }
}

// ===== DECRYPT =====

async function decrypt(chatId, data, iv, payload){

  const s = await initSession(currentUser)

  if(payload.dh_pub){
    const remote=await crypto.subtle.importKey(
      "jwk",
      payload.dh_pub,
      {name:"ECDH",namedCurve:"P-256"},
      true, []
    )

    const shared=await crypto.subtle.deriveBits(
      {name:"ECDH",public:remote},
      keypair.privateKey,
      256
    )

    const root = await kdf(shared)
    s.recvChain = Array.from(root)
    s.Nr=0
  }

  let chain=new Uint8Array(s.recvChain)
  chain=await kdf(chain)
  s.recvChain=Array.from(chain)
  s.Nr++

  const key=await crypto.subtle.importKey("raw",chain,"AES-GCM",false,["decrypt"])

  try{
    const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0))
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(iv)},key,bytes)
    saveSessions()
    return JSON.parse(new TextDecoder().decode(plain))
  }catch(e){
    return null
  }
}

// ===== UTILS =====

async function hashStr(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str))
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("")
}

async function getChatId(a,b){
  return (await hashStr([a,b].sort().join("|"))).slice(0,32)
}

function formatTime(ts){
  return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
}

function trimReplyChain(r, depth=0){
  if(!r || depth>2) return null
  return {
    id:r.id,
    from:r.from,
    text:r.text,
    replyTo: trimReplyChain(r.replyTo, depth+1)
  }
}

// ===== START =====

async function start(){
  myName=document.getElementById("name").value||"anon"
  myId=(await hashStr(myName)).slice(0,32)

  //Фикс регистрации в users
  
  keypair = await crypto.subtle.generateKey(
  {name:"ECDH", namedCurve:"P-256"},
  true,
  ["deriveKey"]
)
  
  await publish()
  loadUsers()
  setInterval(loadUsers,3000)
  poll()

  alert("READY "+myName)
}

// ===== USERS =====

async function loadUsers(){
  const r=await fetch(URL+"/rest/v1/users",{headers:{apikey:KEY}})
  const list=await r.json()

  const el=document.getElementById("users")
  el.innerHTML=""

  list.forEach(u=>{
    if(u.id===myId) return
    const d=document.createElement("div")
    d.className="user"
    d.innerText=u.name
    d.onclick=()=>{currentUser=u.name;loadHistory()}
    el.appendChild(d)
  })
}

async function publish(){

  const pub = await crypto.subtle.exportKey("jwk", keypair.publicKey)

  await fetch(URL+"/rest/v1/users",{
    method:"POST",
    headers:{
      apikey:KEY,
      "Content-Type":"application/json",
      "Prefer":"resolution=merge-duplicates"
    },
    body:JSON.stringify({
      id:myId,
      name:myName,
      pubkey: JSON.stringify(pub),
      prekey: JSON.stringify(pub), // временно = pubkey, фиксим регистрацию в users
      last_seen: Date.now()
    })
  })
}

// ===== SEND =====

async function send(){
  if(!currentUser) return

  const text=document.getElementById("msg").value
  const chatId=await getChatId(myName,currentUser)

  let msg={
    id:crypto.randomUUID(),
    from:myName,
    text,
    time:Date.now(),
    type:"text",
    replyTo: replyTo ? trimReplyChain(replyTo) : null,
    forwardFrom: forwardMsg ? forwardMsg.from : null
  }

  render(msg,true)

  const enc=await encrypt(chatId,msg)

  await fetch(URL+"/rest/v1/messages",{
    method:"POST",
    headers:{apikey:KEY,"Content-Type":"application/json"},
    body:JSON.stringify({
      recipient:chatId,
      sender:myName,
      data:enc.data,
      iv:enc.iv,
      dh_pub:enc.dh_pub,
      n:enc.n,
      pn:enc.pn
    })
  })

  document.getElementById("msg").value=""
  clearReply()
  clearForward()
}

// ===== REACTIONS (FIXED E2E) =====

async function sendReaction(emoji){
  if(!reactionTarget) return

  const chatId=await getChatId(myName,currentUser)

  const msg={
    id:crypto.randomUUID(),
    type:"reaction",
    target:reactionTarget,
    emoji,
    from:myName,
    time:Date.now()
  }

  const enc=await encrypt(chatId,msg)

  await fetch(URL+"/rest/v1/messages",{
    method:"POST",
    headers:{apikey:KEY,"Content-Type":"application/json"},
    body:JSON.stringify({
      recipient:chatId,
      sender:myName,
      data:enc.data,
      iv:enc.iv
    })
  })

  document.getElementById("emojiPicker").style.display="none"
}

function applyReaction(r){
  const key=r.target+"_"+r.from+"_"+r.emoji
  if(reactionDedup.has(key)) return
  reactionDedup.add(key)

  if(!reactionsMap[r.target]) reactionsMap[r.target]={}
  if(!reactionsMap[r.target][r.emoji]) reactionsMap[r.target][r.emoji]=0

  reactionsMap[r.target][r.emoji]++
}

function updateReactionsUI(){
  document.querySelectorAll("[data-id]").forEach(el=>{
    const id=el.dataset.id
    const r=reactionsMap[id]
    if(!r) return

    let text=""
    for(let e in r){
      text+=e+" "+r[e]+" "
    }

    let box=el.querySelector(".reactions")
    if(!box){
      box=document.createElement("div")
      box.className="reactions"
      el.appendChild(box)
    }

    box.innerText=text
  })
}

// ===== HISTORY =====

async function loadHistory(){
  reactionsMap={}
  reactionDedup.clear()
  seen.clear()

  const chatId=await getChatId(myName,currentUser)

  const r=await fetch(URL+"/rest/v1/messages?recipient=eq."+chatId,{headers:{apikey:KEY}})
  const list=await r.json()

  document.getElementById("chat").innerHTML=""

  for(const m of list){
    seen.add(m.id)

    const msg=await decrypt(chatId,m.data,m.iv,m)
    if(!msg) continue

    if(msg.type==="reaction"){
      applyReaction(msg)
    } else {
      render(msg,msg.from===myName)
    }
  }

  updateReactionsUI()
}

// ===== POLL =====

function poll(){
  setInterval(async()=>{
    if(!currentUser) return

    const chatId=await getChatId(myName,currentUser)
    const r=await fetch(URL+"/rest/v1/messages?recipient=eq."+chatId,{headers:{apikey:KEY}})
    const list=await r.json()

    for(const m of list){
      if(seen.has(m.id)) continue
      seen.add(m.id)

      const msg=await decrypt(chatId,m.data,m.iv,m)
      if(!msg) continue

      if(msg.type==="reaction"){
        applyReaction(msg)
        updateReactionsUI()
      } else {
        render(msg,msg.from===myName)
      }
    }
  },1500)
}

// ===== UI =====

function showPicker(id){
  reactionTarget=id
  const picker=document.getElementById("emojiPicker")
  picker.innerHTML=""

  EMOJIS.forEach(e=>{
    const span=document.createElement("span")
    span.innerText=e
    span.onclick=()=>sendReaction(e)
    picker.appendChild(span)
  })

  picker.style.display="block"
}

function render(m,me){
  const d=document.createElement("div")
  d.className="msg "+(me?"me":"peer")
  d.dataset.id=m.id

  d.onclick=()=>setReply(m)
  d.oncontextmenu=(e)=>{e.preventDefault();setForward(m)}

  const btn=document.createElement("div")
  btn.className="reactBtn"
  btn.innerText="🙂"
  btn.onclick=(e)=>{e.stopPropagation();showPicker(m.id)}
  d.appendChild(btn)

  if(m.forwardFrom){
    const f=document.createElement("div")
    f.className="forwardBox"
    f.innerText="Forwarded from "+m.forwardFrom
    d.appendChild(f)
  }

  if(m.replyTo){
    renderReplyChain(d, m.replyTo)
  }

  const text=document.createElement("div")
  text.innerText=m.from+": "+m.text

  const time=document.createElement("div")
  time.className="time"
  time.innerText=formatTime(m.time)

  d.appendChild(text)
  d.appendChild(time)

  document.getElementById("chat").appendChild(d)
}

function renderReplyChain(container, r, level=0){
  if(!r) return
  const div=document.createElement("div")
  div.className="replyBox"
  div.style.marginLeft = (level*8)+"px"
  div.innerText=r.from+": "+r.text
  container.appendChild(div)
  renderReplyChain(container, r.replyTo, level+1)
}

function setReply(m){
  replyTo=m
  const el=document.getElementById("replyPreview")
  el.style.display="block"
  el.innerText="Reply: "+m.from+": "+m.text
}

function clearReply(){
  replyTo=null
  document.getElementById("replyPreview").style.display="none"
}

function setForward(m){
  forwardMsg=m
  const el=document.getElementById("forwardPreview")
  el.style.display="block"
  el.innerText="Forward: "+m.from+": "+m.text
}

function clearForward(){
  forwardMsg=null
  document.getElementById("forwardPreview").style.display="none"
}

</script>

</body>
</html>
