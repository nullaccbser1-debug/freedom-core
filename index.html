<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Anon Signal V39</title>

<style>
body { margin:0; font-family:system-ui; background:#111; color:white; }
#app { display:flex; height:100vh; }
#sidebar { width:240px; background:#1e1e1e; padding:10px; }
input,button { width:100%; margin:5px 0; padding:8px; }
.user { padding:8px; cursor:pointer; }
.user:hover { background:#333; }
#chat { flex:1; overflow:auto; padding:10px; }
.msg { margin:5px; padding:8px; border-radius:10px; }
.me { background:#0af; margin-left:auto; }
.peer { background:#444; }
</style>
</head>
<body>

<div id="app">

<div id="sidebar">
  <input id="name" placeholder="Your name">
  <button onclick="start()">Start</button>
  <div id="users"></div>
</div>

<div style="flex:1; display:flex; flex-direction:column;">
  <div id="chat"></div>
  <div style="display:flex;">
    <input id="msg">
    <button onclick="send()">➤</button>
  </div>
</div>

</div>

<script>

const URL="https://ubfytoriwbhglblxdzto.supabase.co"
const KEY="sb_publishable_vd185mW1MiBYYxKZg1HwRg_pOuAWq72"

let myName, myId, currentUser=null
let seen = new Set()

// HASH
async function hashStr(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str))
  return Array.from(new Uint8Array(buf))
    .map(b=>b.toString(16).padStart(2,"0")).join("")
}

// 🔥 CHAT ID
async function getChatId(a,b){
  return (await hashStr([a,b].sort().join("|"))).slice(0,32)
}

// START
async function start(){

  myName=document.getElementById("name").value || "anon"
  myId=(await hashStr(myName)).slice(0,32)

  await publish()

  loadUsers()
  setInterval(loadUsers,3000)

  poll()

  alert("READY "+myName)
}

// USERS
async function loadUsers(){

  const r=await fetch(URL+"/rest/v1/users",{headers:{apikey:KEY}})
  const list=await r.json()

  const el=document.getElementById("users")
  el.innerHTML=""

  list.forEach(u=>{

    if(u.id===myId) return

    const d=document.createElement("div")
    d.className="user"
    d.innerText=u.name

    d.onclick=()=>{
      currentUser=u.name
      loadHistory()
    }

    el.appendChild(d)
  })
}

// PUBLISH
async function publish(){

  const keypair=await crypto.subtle.generateKey(
    {name:"ECDH",namedCurve:"P-256"},true,["deriveKey"]
  )

  const pre=await crypto.subtle.generateKey(
    {name:"ECDH",namedCurve:"P-256"},true,["deriveKey"]
  )

  const pub=await crypto.subtle.exportKey("jwk",keypair.publicKey)
  const prekey=await crypto.subtle.exportKey("jwk",pre.publicKey)

  await fetch(URL+"/rest/v1/users",{
    method:"POST",
    headers:{
      apikey:KEY,
      "Content-Type":"application/json",
      "Prefer":"resolution=merge-duplicates"
    },
    body:JSON.stringify({
      id: myId,
      pubkey: pub,
      prekey: prekey,
      name: myName,
      last_seen: Date.now()
    })
  })
}

// SEND
async function send(){

  if(!currentUser) return

  const text=document.getElementById("msg").value
  if(!text) return

  const chatId=await getChatId(myName,currentUser)

  const msg={
    from: myName,
    text,
    time: Date.now()
  }

  render(msg,true)

  await fetch(URL+"/rest/v1/messages",{
    method:"POST",
    headers:{
      apikey:KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      recipient: chatId,
      sender: myName,
      data: JSON.stringify(msg),
      iv: []
    })
  })

  document.getElementById("msg").value=""
}

// LOAD HISTORY
async function loadHistory(){

  const chatId=await getChatId(myName,currentUser)

  const r=await fetch(
    URL+"/rest/v1/messages?recipient=eq."+chatId,
    {headers:{apikey:KEY}}
  )

  const list=await r.json()

  document.getElementById("chat").innerHTML=""

  list.forEach(m=>{
    const msg=JSON.parse(m.data)
    render(msg, msg.from===myName)
  })
}

// POLL
function poll(){

  setInterval(async()=>{

    if(!currentUser) return

    const chatId=await getChatId(myName,currentUser)

    const r=await fetch(
      URL+"/rest/v1/messages?recipient=eq."+chatId,
      {headers:{apikey:KEY}}
    )

    const list=await r.json()

    for(const m of list){

      if(seen.has(m.id)) continue
      seen.add(m.id)

      const msg=JSON.parse(m.data)

      render(msg, msg.from===myName)
    }

  },1500)
}

// UI
function render(m,me){
  const d=document.createElement("div")
  d.className="msg "+(me?"me":"peer")
  d.innerText=m.from+": "+m.text
  document.getElementById("chat").appendChild(d)
}

</script>

</body>
</html>
