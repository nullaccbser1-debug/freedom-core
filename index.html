<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Anon Signal V44</title>

<style>
body { margin:0; font-family:system-ui; background:#111; color:white; }

#app { display:flex; height:100vh; }

#sidebar {
  width:240px;
  background:#1e1e1e;
  padding:10px;
}

input,button {
  width:100%;
  margin:5px 0;
  padding:8px;
}

.user {
  padding:8px;
  cursor:pointer;
}
.user:hover { background:#333; }

#chat {
  flex:1;
  overflow:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
}

.msg {
  max-width:70%;
  margin:6px;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  position:relative;
}

.me { background:#0af; margin-left:auto; }
.peer { background:#333; }

.time {
  font-size:10px;
  opacity:0.6;
  text-align:right;
}

.replyBox {
  border-left:3px solid #0af;
  padding-left:6px;
  margin-bottom:4px;
  font-size:12px;
  opacity:0.8;
}

.forwardBox {
  font-size:11px;
  opacity:0.6;
  margin-bottom:4px;
}

.reactions {
  margin-top:4px;
  font-size:13px;
}

.reactBtn {
  position:absolute;
  right:6px;
  top:6px;
  font-size:14px;
  opacity:0.6;
  cursor:pointer;
}

#emojiPicker {
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  padding:10px;
  border-radius:10px;
  display:none;
}

#emojiPicker span {
  font-size:20px;
  margin:5px;
  cursor:pointer;
}

#replyPreview, #forwardPreview {
  background:#222;
  padding:6px;
  font-size:12px;
  display:none;
}

#mode {
  font-size:12px;
  opacity:0.7;
}
</style>
</head>
<body>

<div id="app">

<div id="sidebar">
  <input id="name" placeholder="Your name">
  <button onclick="start()">Start</button>
  <div id="mode"></div>
  <div id="users"></div>
</div>

<div style="flex:1; display:flex; flex-direction:column;">
  <div id="chat"></div>

  <div id="replyPreview"></div>
  <div id="forwardPreview"></div>

  <div style="display:flex;">
    <input id="msg">
    <button onclick="send()">➤</button>
  </div>
</div>

</div>

<div id="emojiPicker"></div>

<script>

// ===== REDIRECT =====
const ONLINE_URL = "https://nullaccbser1-debug.github.io/freedom-core/"
if(location.protocol==="file:"||location.protocol==="content:"){
  setTimeout(()=>location.href=ONLINE_URL,700)
}
document.getElementById("mode").innerText =
  location.protocol==="http:"||location.protocol==="https:"
  ? "🟢 ONLINE" : "🟡 LOCAL"

// ===== CONFIG =====
const URL="https://ubfytoriwbhglblxdzto.supabase.co"
const KEY="sb_publishable_vd185mW1MiBYYxKZg1HwRg_pOuAWq72"

let myName,myId,currentUser=null
let seen=new Set()
let replyTo=null
let forwardMsg=null

// реакции
let reactionsMap={}
let reactionTarget=null
const EMOJIS=["👍","🔥","😂","❤️","😮","😢"]

// ===== UTILS =====

async function hashStr(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str))
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("")
}

async function getChatId(a,b){
  return (await hashStr([a,b].sort().join("|"))).slice(0,32)
}

function formatTime(ts){
  return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
}

// ===== REPLY DEPTH =====

function trimReplyChain(r, depth=0){
  if(!r || depth>2) return null
  return {
    id:r.id,
    from:r.from,
    text:r.text,
    replyTo: trimReplyChain(r.replyTo, depth+1)
  }
}

// ===== START =====

async function start(){
  myName=document.getElementById("name").value||"anon"
  myId=(await hashStr(myName)).slice(0,32)

  await publish()
  loadUsers()
  setInterval(loadUsers,3000)
  poll()

  alert("READY "+myName)
}

// ===== USERS =====

async function loadUsers(){
  const r=await fetch(URL+"/rest/v1/users",{headers:{apikey:KEY}})
  const list=await r.json()

  const el=document.getElementById("users")
  el.innerHTML=""

  list.forEach(u=>{
    if(u.id===myId) return

    const d=document.createElement("div")
    d.className="user"
    d.innerText=u.name
    d.onclick=()=>{currentUser=u.name;loadHistory()}
    el.appendChild(d)
  })
}

async function publish(){

  const keypair=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveKey"])
  const pre=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveKey"])

  const pub=await crypto.subtle.exportKey("jwk",keypair.publicKey)
  const prekey=await crypto.subtle.exportKey("jwk",pre.publicKey)

  await fetch(URL+"/rest/v1/users",{
    method:"POST",
    headers:{
      apikey:KEY,
      "Content-Type":"application/json",
      "Prefer":"resolution=merge-duplicates"
    },
    body:JSON.stringify({
      id:myId,
      pubkey:pub,
      prekey:prekey,
      name:myName,
      last_seen:Date.now()
    })
  })
}

// ===== SEND =====

async function send(){

  if(!currentUser) return

  const text=document.getElementById("msg").value
  const chatId=await getChatId(myName,currentUser)

  let msg={
    id:crypto.randomUUID(),
    from:myName,
    text,
    time:Date.now(),
    type:"text",
    replyTo: replyTo ? trimReplyChain(replyTo) : null,
    forwardFrom: forwardMsg ? forwardMsg.from : null
  }

  if(forwardMsg){
    msg.text = forwardMsg.text
    msg.replyTo = trimReplyChain(forwardMsg.replyTo)
  }

  render(msg,true)

  await fetch(URL+"/rest/v1/messages",{
    method:"POST",
    headers:{apikey:KEY,"Content-Type":"application/json"},
    body:JSON.stringify({
      recipient:chatId,
      sender:myName,
      data:JSON.stringify(msg),
      iv:[]
    })
  })

  document.getElementById("msg").value=""
  clearReply()
  clearForward()
}

// ===== REACTIONS =====

async function sendReaction(emoji){
  if(!reactionTarget) return

  const chatId=await getChatId(myName,currentUser)

  const msg={
    type:"reaction",
    target:reactionTarget,
    emoji,
    from:myName,
    time:Date.now()
  }

  await fetch(URL+"/rest/v1/messages",{
    method:"POST",
    headers:{apikey:KEY,"Content-Type":"application/json"},
    body:JSON.stringify({
      recipient:chatId,
      sender:myName,
      data:JSON.stringify(msg),
      iv:[]
    })
  })

  document.getElementById("emojiPicker").style.display="none"
}

function applyReaction(r){
  if(!reactionsMap[r.target]) reactionsMap[r.target]={}
  if(!reactionsMap[r.target][r.emoji]) reactionsMap[r.target][r.emoji]=0
  reactionsMap[r.target][r.emoji]++
}

function updateReactionsUI(){
  document.querySelectorAll("[data-id]").forEach(el=>{
    const id=el.dataset.id
    const r=reactionsMap[id]
    if(!r) return

    let text=""
    for(let e in r){
      text+=e+" "+r[e]+" "
    }

    let box=el.querySelector(".reactions")
    if(!box){
      box=document.createElement("div")
      box.className="reactions"
      el.appendChild(box)
    }

    box.innerText=text
  })
}

// ===== HISTORY =====

async function loadHistory(){
  reactionsMap={}
  seen.clear()

  const chatId=await getChatId(myName,currentUser)

  const r=await fetch(URL+"/rest/v1/messages?recipient=eq."+chatId,{headers:{apikey:KEY}})
  const list=await r.json()

  document.getElementById("chat").innerHTML=""

  list.forEach(m=>{
    seen.add(m.id)
    const msg=JSON.parse(m.data)

    if(msg.type==="reaction"){
      applyReaction(msg)
    } else {
      render(msg,msg.from===myName)
    }
  })

  updateReactionsUI()
}

// ===== POLL =====

function poll(){
  setInterval(async()=>{
    if(!currentUser) return

    const chatId=await getChatId(myName,currentUser)

    const r=await fetch(URL+"/rest/v1/messages?recipient=eq."+chatId,{headers:{apikey:KEY}})
    const list=await r.json()

    for(const m of list){
      if(seen.has(m.id)) continue
      seen.add(m.id)

      const msg=JSON.parse(m.data)

      if(msg.type==="reaction"){
        applyReaction(msg)
        updateReactionsUI()
      } else {
        render(msg,msg.from===myName)
      }
    }
  },1500)
}

// ===== PICKER =====

function showPicker(id){
  reactionTarget=id
  const picker=document.getElementById("emojiPicker")
  picker.innerHTML=""

  EMOJIS.forEach(e=>{
    const span=document.createElement("span")
    span.innerText=e
    span.onclick=()=>sendReaction(e)
    picker.appendChild(span)
  })

  picker.style.display="block"
}

// ===== RENDER =====

function render(m,me){

  const d=document.createElement("div")
  d.className="msg "+(me?"me":"peer")
  d.dataset.id=m.id

  d.onclick=()=>setReply(m)
  d.oncontextmenu=(e)=>{e.preventDefault();setForward(m)}

  const btn=document.createElement("div")
  btn.className="reactBtn"
  btn.innerText="🙂"
  btn.onclick=(e)=>{e.stopPropagation();showPicker(m.id)}
  d.appendChild(btn)

  if(m.forwardFrom){
    const f=document.createElement("div")
    f.className="forwardBox"
    f.innerText="Forwarded from "+m.forwardFrom
    d.appendChild(f)
  }

  if(m.replyTo){
    renderReplyChain(d, m.replyTo)
  }

  const text=document.createElement("div")
  text.innerText=m.from+": "+m.text

  const time=document.createElement("div")
  time.className="time"
  time.innerText=formatTime(m.time)

  d.appendChild(text)
  d.appendChild(time)

  document.getElementById("chat").appendChild(d)
}

function renderReplyChain(container, r, level=0){
  if(!r) return

  const div=document.createElement("div")
  div.className="replyBox"
  div.style.marginLeft = (level*8)+"px"
  div.innerText=r.from+": "+r.text

  container.appendChild(div)

  renderReplyChain(container, r.replyTo, level+1)
}

// ===== ACTIONS =====

function setReply(m){
  replyTo=m
  const el=document.getElementById("replyPreview")
  el.style.display="block"
  el.innerText="Reply: "+m.from+": "+m.text
}

function clearReply(){
  replyTo=null
  document.getElementById("replyPreview").style.display="none"
}

function setForward(m){
  forwardMsg=m
  const el=document.getElementById("forwardPreview")
  el.style.display="block"
  el.innerText="Forward: "+m.from+": "+m.text
}

function clearForward(){
  forwardMsg=null
  document.getElementById("forwardPreview").style.display="none"
}

</script>

</body>
</html>
