<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Anon Signal V44</title>

<style>
body { margin:0; font-family:system-ui; background:#111; color:white; }
#app { display:flex; height:100vh; }

#sidebar { width:240px; background:#1e1e1e; padding:10px; }

input,button { width:100%; margin:5px 0; padding:8px; }

.user { padding:8px; cursor:pointer; }
.user:hover { background:#333; }

#chat {
  flex:1;
  overflow:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
}

.msg {
  max-width:70%;
  margin:6px;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  position:relative;
}

.me { background:#0af; margin-left:auto; }
.peer { background:#333; }

.time { font-size:10px; opacity:0.6; text-align:right; }

.replyBox {
  border-left:3px solid #0af;
  padding-left:6px;
  margin-bottom:4px;
  font-size:12px;
  opacity:0.8;
}

.forwardBox {
  font-size:11px;
  opacity:0.6;
  margin-bottom:4px;
}

.reactions {
  margin-top:4px;
  font-size:14px;
}

.reactionBtn {
  margin-right:6px;
  cursor:pointer;
}

#emojiPicker {
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  padding:10px;
  border-radius:10px;
  display:none;
}

#emojiPicker span {
  font-size:20px;
  margin:5px;
  cursor:pointer;
}

#replyPreview,#forwardPreview {
  background:#222;
  padding:6px;
  font-size:12px;
  display:none;
}
</style>
</head>
<body>

<div id="app">

<div id="sidebar">
  <input id="name" placeholder="Your name">
  <button onclick="start()">Start</button>
  <div id="users"></div>
</div>

<div style="flex:1; display:flex; flex-direction:column;">
  <div id="chat"></div>

  <div id="replyPreview"></div>
  <div id="forwardPreview"></div>

  <div style="display:flex;">
    <input id="msg">
    <button onclick="send()">➤</button>
  </div>
</div>

</div>

<div id="emojiPicker"></div>

<script>

const URL="https://ubfytoriwbhglblxdzto.supabase.co"
const KEY="sb_publishable_vd185mW1MiBYYxKZg1HwRg_pOuAWq72"

let myName,myId,currentUser=null
let seen=new Set()
let replyTo=null
let forwardMsg=null
let reactionsMap={} // msgId -> {emoji:count}
let reactionTarget=null

const EMOJIS=["👍","🔥","😂","❤️","😮","😢"]

// ===== UTILS =====

async function hashStr(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str))
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("")
}

async function getChatId(a,b){
  return (await hashStr([a,b].sort().join("|"))).slice(0,32)
}

function formatTime(ts){
  return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
}

// ===== START =====

async function start(){
  myName=document.getElementById("name").value||"anon"
  myId=(await hashStr(myName)).slice(0,32)

  loadUsers()
  setInterval(loadUsers,3000)
  poll()
}

// ===== USERS =====

async function loadUsers(){
  const r=await fetch(URL+"/rest/v1/users",{headers:{apikey:KEY}})
  const list=await r.json()

  const el=document.getElementById("users")
  el.innerHTML=""

  list.forEach(u=>{
    if(u.id===myId) return

    const d=document.createElement("div")
    d.className="user"
    d.innerText=u.name
    d.onclick=()=>{currentUser=u.name;loadHistory()}
    el.appendChild(d)
  })
}

// ===== SEND =====

async function send(){

  if(!currentUser) return

  const text=document.getElementById("msg").value
  const chatId=await getChatId(myName,currentUser)

  let msg={
    id:crypto.randomUUID(),
    from:myName,
    text,
    time:Date.now(),
    type:"text",
    replyTo: replyTo,
    forwardFrom: forwardMsg ? forwardMsg.from : null
  }

  render(msg,true)

  await fetch(URL+"/rest/v1/messages",{
    method:"POST",
    headers:{apikey:KEY,"Content-Type":"application/json"},
    body:JSON.stringify({
      recipient:chatId,
      sender:myName,
      data:JSON.stringify(msg),
      iv:[]
    })
  })

  document.getElementById("msg").value=""
  replyTo=null
  forwardMsg=null
}

// ===== REACTION SEND =====

async function sendReaction(emoji){

  if(!reactionTarget) return

  const chatId=await getChatId(myName,currentUser)

  const msg={
    type:"reaction",
    target:reactionTarget,
    emoji:emoji,
    from:myName,
    time:Date.now()
  }

  await fetch(URL+"/rest/v1/messages",{
    method:"POST",
    headers:{apikey:KEY,"Content-Type":"application/json"},
    body:JSON.stringify({
      recipient:chatId,
      sender:myName,
      data:JSON.stringify(msg),
      iv:[]
    })
  })

  document.getElementById("emojiPicker").style.display="none"
}

// ===== HISTORY =====

async function loadHistory(){
  reactionsMap={}
  const chatId=await getChatId(myName,currentUser)

  const r=await fetch(URL+"/rest/v1/messages?recipient=eq."+chatId,{headers:{apikey:KEY}})
  const list=await r.json()

  document.getElementById("chat").innerHTML=""

  list.forEach(m=>{
    const msg=JSON.parse(m.data)

    if(msg.type==="reaction"){
      applyReaction(msg)
    } else {
      render(msg,msg.from===myName)
    }
  })
}

// ===== POLL =====

function poll(){
  setInterval(async()=>{
    if(!currentUser) return

    const chatId=await getChatId(myName,currentUser)

    const r=await fetch(URL+"/rest/v1/messages?recipient=eq."+chatId,{headers:{apikey:KEY}})
    const list=await r.json()

    for(const m of list){
      if(seen.has(m.id)) continue
      seen.add(m.id)

      const msg=JSON.parse(m.data)

      if(msg.type==="reaction"){
        applyReaction(msg)
        updateReactionsUI()
      } else {
        render(msg,msg.from===myName)
      }
    }
  },1500)
}

// ===== REACTIONS =====

function applyReaction(r){
  if(!reactionsMap[r.target]) reactionsMap[r.target]={}
  if(!reactionsMap[r.target][r.emoji]) reactionsMap[r.target][r.emoji]=0
  reactionsMap[r.target][r.emoji]++
}

function updateReactionsUI(){
  document.querySelectorAll("[data-id]").forEach(el=>{
    const id=el.dataset.id
    const r=reactionsMap[id]
    if(!r) return

    let text=""
    for(let e in r){
      text+=e+" "+r[e]+" "
    }

    let box=el.querySelector(".reactions")
    if(!box){
      box=document.createElement("div")
      box.className="reactions"
      el.appendChild(box)
    }

    box.innerText=text
  })
}

// ===== EMOJI PICKER =====

function showPicker(id){
  reactionTarget=id
  const picker=document.getElementById("emojiPicker")
  picker.innerHTML=""

  EMOJIS.forEach(e=>{
    const span=document.createElement("span")
    span.innerText=e
    span.onclick=()=>sendReaction(e)
    picker.appendChild(span)
  })

  picker.style.display="block"
}

// ===== RENDER =====

function render(m,me){

  const d=document.createElement("div")
  d.className="msg "+(me?"me":"peer")
  d.dataset.id=m.id

  d.onclick=()=>replyTo=m
  d.oncontextmenu=(e)=>{
    e.preventDefault()
    showPicker(m.id)
  }

  if(m.forwardFrom){
    const f=document.createElement("div")
    f.className="forwardBox"
    f.innerText="Forwarded from "+m.forwardFrom
    d.appendChild(f)
  }

  if(m.replyTo){
    const r=document.createElement("div")
    r.className="replyBox"
    r.innerText=m.replyTo.from+": "+m.replyTo.text
    d.appendChild(r)
  }

  const text=document.createElement("div")
  text.innerText=m.from+": "+m.text

  const time=document.createElement("div")
  time.className="time"
  time.innerText=formatTime(m.time)

  d.appendChild(text)
  d.appendChild(time)

  document.getElementById("chat").appendChild(d)
}

</script>

</body>
</html>
