<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Anon Signal V38.1</title>

<style>
body { margin:0; font-family:system-ui; background:#111; color:white; }
#app { display:flex; height:100vh; }
#sidebar { width:240px; background:#1e1e1e; padding:10px; }
input,button { width:100%; margin:5px 0; padding:8px; }
.user { padding:8px; cursor:pointer; }
.user:hover { background:#333; }
#chat { flex:1; overflow:auto; padding:10px; }
.msg { margin:5px; padding:8px; border-radius:10px; }
.me { background:#0af; margin-left:auto; }
.peer { background:#444; }
#log { height:120px; overflow:auto; font-size:11px; color:#0f0; }
</style>
</head>
<body>

<div id="app">

<div id="sidebar">
  <input id="name" placeholder="Your name">
  <button onclick="start()">Start</button>
  <div id="mode"></div>
  <div id="users"></div>
  <div id="log"></div>
</div>

<div style="flex:1; display:flex; flex-direction:column;">
  <div id="chat"></div>
  <div style="display:flex;">
    <input id="msg">
    <button onclick="send()">➤</button>
  </div>
</div>

</div>

<script>

const URL="https://ubfytoriwbhglblxdzto.supabase.co"
const KEY="sb_publishable_vd185mW1MiBYYxKZg1HwRg_pOuAWq72"

// 🚀 твой сайт
const ONLINE_URL = "https://nullaccbser1-debug.github.io/freedom-core/"

// авто переход
if(location.protocol === "file:" || location.protocol === "content:"){
  setTimeout(()=> location.href = ONLINE_URL, 800)
}

const ONLINE = location.protocol.startsWith("http")

document.getElementById("mode").innerText =
  ONLINE ? "🟢 ONLINE" : "🟡 LOCAL"

let myName, myId, currentUser=null
let queue=[]

// HASH
async function hashStr(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str))
  return Array.from(new Uint8Array(buf))
    .map(b=>b.toString(16).padStart(2,"0")).join("")
}

function log(x){
  console.log(x)
  document.getElementById("log").innerText += x+"\n"
}

// START
async function start(){

  myName = document.getElementById("name").value || "anon"

  // 🔥 СТАБИЛЬНЫЙ ID
  myId = (await hashStr(myName)).slice(0,32)

  await publish()

  loadUsers()
  setInterval(loadUsers,3000)

  retryLoop()

  alert("READY "+myName)
}

// ✅ FIXED PUBLISH
async function publish(){

  log("PUBLISH "+myName)

  const res = await fetch(URL+"/rest/v1/users",{
    method:"POST",
    headers:{
      apikey:KEY,
      "Content-Type":"application/json",
      "Prefer":"resolution=merge-duplicates"
    },
    body:JSON.stringify({
      id: myId,
      name: myName,
      last_seen: Date.now()
    })
  })

  log("PUBLISH STATUS "+res.status)
}

// USERS
async function loadUsers(){

  const r=await fetch(URL+"/rest/v1/users",{headers:{apikey:KEY}})
  const list=await r.json()

  const el=document.getElementById("users")
  el.innerHTML=""

  list.forEach((u,i)=>{

    if(u.id === myId) return

    const d=document.createElement("div")
    d.className="user"
    d.innerText=u.name

    d.onclick=()=>{
      currentUser=u.name
      log("SELECT "+u.name)
    }

    el.appendChild(d)

    if(!currentUser && i===0){
      currentUser=u.name
      log("AUTO "+u.name)
    }

  })
}

// SEND
async function send(){

  const text=document.getElementById("msg").value
  if(!text || !currentUser) return

  const payload={
    id: crypto.randomUUID(),
    recipient: currentUser,
    sender: myName,
    data: [1],
    iv: [1]
  }

  queue.push(payload)

  render({from:myName,text},true)

  document.getElementById("msg").value=""
}

// RETRY
function retryLoop(){

  setInterval(async()=>{

    if(queue.length===0) return

    const m = queue[0]

    log("SEND "+m.id)

    const res=await fetch(URL+"/rest/v1/messages",{
      method:"POST",
      headers:{
        apikey:KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify(m)
    })

    log("STATUS "+res.status)

    if(res.ok){
      queue.shift()
    }

  },1500)
}

// UI
function render(m,me){
  const d=document.createElement("div")
  d.className="msg "+(me?"me":"peer")
  d.innerText=m.from+": "+m.text
  document.getElementById("chat").appendChild(d)
}

</script>

</body>
</html>
